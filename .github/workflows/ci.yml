name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.1', extensions: pdo_mysql, mbstring, fileinfo }
      - run: find app bin config public -name '*.php' -print0 | xargs -0 -n1 php -l
